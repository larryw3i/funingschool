      "{% trans 'It does not matter how slowly you go as long as you do not stop.' %}",
      "{% trans 'The best time to plant a tree was 20 years ago. The second best time is now.' %}",
      "{% trans 'The only way to do great work is to love what you do.' %}",
      "{% trans 'In the middle of difficulty lies opportunity.' %}",
      "{% trans 'Gold is not a treasure, but books are. All things are vain, but kindness is not.' %}",

    var randomIndex = Math.floor(Math.random() * proverbs.length);
    $('.navbar-brand').attr('title', proverbs[randomIndex]);
  });
  // The end.
</script>
